name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inject site URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL repo variable not set (e.g. https://dxxxx.cloudfront.net)"
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          sed -i "s#__SITE_URL__#$SITE_URL#g" index.html sitemap.xml robots.txt llms.txt

      - name: Inject Amplitude key
        env:
          AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
        run: |
          if [ -n "$AMPLITUDE_API_KEY" ]; then
            sed -i "s/__AMPLITUDE_API_KEY__/$AMPLITUDE_API_KEY/g" index.html
          else
            echo "::warning::AMPLITUDE_API_KEY repo variable not set; deploying without analytics"
          fi

      - name: Sync site to S3
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          EXCLUDES=(
            --exclude ".git/*"
            --exclude ".github/*"
            --exclude "terraform/*"
            --exclude "Attachments-Re_ things/*"
            --exclude "README.md"
            --exclude ".gitignore"
          )
          # Assets: cacheable for a day (CloudFront is invalidated below).
          aws s3 sync . "s3://$BUCKET" --delete "${EXCLUDES[@]}" \
            --exclude "*.html" \
            --cache-control "public, max-age=86400"
          # HTML: always revalidate so new deploys show up immediately.
          aws s3 sync . "s3://$BUCKET" "${EXCLUDES[@]}" \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
